<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульс компании · Фотопринт</title>
<meta name="description" content="Управленческая платформа ООО «Фотопринт»: KPI, причины отклонений, реестр решений.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="fotoprint.css">
<link rel="stylesheet" href="fotik.css">
<link rel="icon" type="image/png" href="picpac-logo.png">
</head>
<body>
<a class="skip" href="#view">Перейти к содержимому</a>

<div id="login" hidden></div>

<div class="frame" id="app" hidden>
  <aside class="side" id="side" aria-label="Основная навигация"></aside>
  <div class="nav-scrim" id="navScrim" data-action="close-drawer"></div>
  <div class="main">
    <header class="head">
      <div class="ttl-wrap">
        <button class="icon-btn burger" data-action="open-drawer" aria-label="Открыть меню" aria-controls="side" aria-expanded="false"></button>
        <div><h1 id="ptitle" tabindex="-1">Пульс компании</h1><div class="fbar" id="fbar"></div></div>
      </div>
      <div class="user">
        <button class="circ" id="searchBtn" data-action="palette" aria-label="Поиск (Ctrl+K)" title="Поиск · Ctrl+K"></button>
        <div class="pop-wrap">
          <button class="circ" id="bellBtn" data-action="toggle-pop" data-pop="notif" aria-haspopup="true" aria-expanded="false" aria-label="Уведомления"></button>
          <div class="pop notif" id="pop-notif" hidden></div>
        </div>
        <div class="pop-wrap">
          <button class="profile" data-action="toggle-pop" data-pop="profile" aria-haspopup="true" aria-expanded="false" aria-label="Меню профиля">
            <span class="avatar" aria-hidden="true"></span>
            <span class="who"><span class="uname" id="uname"></span><br><span class="urole" id="urole"></span></span>
          </button>
          <div class="pop" id="pop-profile" hidden></div>
        </div>
      </div>
    </header>
    <div id="net" role="alert" aria-live="assertive"></div>
    <main id="view" tabindex="-1" style="outline:none;flex:1;display:flex;flex-direction:column" aria-live="polite"></main>
  </div>
</div>
<div id="modal" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script src="fotik.js"></script>
</body>
</html>
